name: Validate Flight Chess

on:
  push:
    branches: [main, fix/canonical-flight-chess-board-geometry]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Match the supported OS for the pinned Playwright browser/dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax, asset and unit regression checks
        run: |
          mkdir -p test-results
          npm run check 2>&1 | tee test-results/static-checks.log
          npm test 2>&1 | tee test-results/unit-tests.log
          npm run build 2>&1 | tee test-results/build.log
      - name: Install real-browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          # Hosted Ubuntu 24.04 already has Chrome's runtime libraries.
          # Keep pinned Chromium without redundant apt upgrades/mirror stalls.
          python -m playwright install chromium
          bash scripts/prepare-ci-fonts.sh | tee test-results/font-environment.log
      - name: Chromium interactions, real persistence and twenty complete games
        run: |
          python tests/browser_regression.py 2>&1 | tee test-results/browser-tests.log
          python tests/browser_visibility.py 2>&1 | tee test-results/visibility-tests.log
      - name: Retain logs and actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-chess-test-evidence
          path: test-results/
          retention-days: 30
      - name: Package tested static game
        uses: actions/upload-artifact@v4
        with:
          name: flight-chess-playable
          path: dist/
          retention-days: 30
