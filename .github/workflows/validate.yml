name: Validate Flight Chess

on:
  push:
    branches: [main, fix/canonical-flight-chess-board-geometry]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run existing regression tests
        run: node --test tests/*.test.cjs
      - name: Collect review source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-chess-review-source
          path: |
            *.html
            *.js
            *.md
            LICENSE
            tests/
          retention-days: 7
