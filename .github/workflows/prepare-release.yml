name: Prepare and verify release candidate
on:
  push:
    branches: [fix/canonical-flight-chess-board-geometry]
    paths: ['tools/prepare-release.py', '.github/workflows/prepare-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/canonical-flight-chess-board-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-flight-chess-board-geometry
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hash-guarded source migration
        run: python tools/prepare-release.py
      - name: Syntax and unit checks
        run: |
          npm run check
          npm test
          npm run build
      - name: Install Chromium test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test real hosted browser including storage and download
        run: python tests/browser_regression.py
      - name: Retain release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-chess-verified-candidate
          path: |
            dist/
            src/
            styles/
            skybound_flight_chess_interface.html
            board-geometry.js
            tests/
            test-results/
          retention-days: 14
      - name: Commit generated source only after all tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skybound_flight_chess_interface.html src/app.js src/rules.js styles/game.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: integrate verified board, AI, rules and persistence release'
          git push origin HEAD:fix/canonical-flight-chess-board-geometry
